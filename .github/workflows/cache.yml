name: Cache Workflow

on:
  push:
  workflow_dispatch:

jobs:
  cache-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Cache dependencies
        id: cache-step
        uses: actions/cache@v4
        with:
          path: ~/.cache
          key: cache-7f33eab

      - name: prime-cache-7f33eab
        run: echo "Cache hit = ${{ steps.cache-step.outputs.cache-hit }}"
